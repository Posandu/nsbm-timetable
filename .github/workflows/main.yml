on:
  push:
    branches:
      - main
    paths-ignore:
      - "ics/**"
      - "config.json"
  schedule:
    - cron: "0 */8 * * *"

jobs:
  update_calanders:
    environment: main
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - run: bun install

      - name: Update Calanders
        env:
          CAL_LINK: ${{ secrets.CAL_LINK }}
        run: bash ./scripts/download.sh

      - run: bun run index.ts

      - name: Commit calendars
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ics config.json
          if git diff --staged --quiet; then
            echo "No calendar changes"
          else
            git commit -m "Update degree calendars"
            git push
          fi
